name: PB F14 saved-add replay type1 RNDbot hold OFF (source, no SQL)

on:
  push:
    branches:
      - fix/cs01-pb11-f14-restart-add-event-replay-hold-off-20261108
  pull_request:
    branches:
      - feature/cs01-pb10-f14-vanilla-tbc-rndbot-preactivation-hold-off-20261108

permissions:
  contents: read

jobs:
  exact-replay-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout child plus immutable PB11 source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Strict 5-file scope, no config, SQL or factory mutation
        shell: bash
        run: |
          set -euo pipefail
          parent=a612093fde694fadf79d0bd790fcd82cb4f9b6b8
          git merge-base --is-ancestor "$parent" HEAD
          git diff --check "$parent" HEAD
          git diff --name-only "$parent" HEAD | sort >/tmp/actual
          printf '%s\n' \
            src/Bot/RandomPlayerbotMgr.cpp \
            tests/test_f14_vanilla_rndbot_saved_add_replay_source.py \
            docs/F14_VANILLA_RNDBOT_PREACTIVATION_HOLD_2026-11-08.md \
            docs/CUSTOM_MODIFICATIONS_REGISTER.md \
            .github/workflows/playerbots-f14-replay-hold-off-20261108.yml \
            | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$parent" HEAD -- conf src/PlayerbotAIConfig.cpp src/PlayerbotAIConfig.h src/Bot/Factory sql data)"
          grep -Fqx 'Playerbots.F14HoldTbcRaceRandomBotsDuringVanilla = 0' conf/playerbots.conf.dist
          echo 'PASS: default-OFF, no SQL, factory, config, paid or stage write'
      - name: Actual PB11/PB12 exact C++ source reconstruction and saved-event negative guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_f14_vanilla_rndbot_saved_add_replay_source.py' -v
      - name: Reuse PB11 original pure 1024-case policy in GCC and Clang C++17/20
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            for std in c++17 c++20; do
              for mode in normal ndebug; do
                flags=()
                if [[ "$mode" == ndebug ]]; then flags=(-DNDEBUG); fi
                "$compiler" -std="$std" -Wall -Wextra -Werror -pedantic -O2 "${flags[@]}" \
                  tests/f14_vanilla_tbc_rndbot_population_hold.cpp -o /tmp/pb-f14-hold
                /tmp/pb-f14-hold
              done
            done
          done
      - name: Keep original PB11 pre-add source baseline separately green
        shell: bash
        run: |
          set -euo pipefail
          # The original strict PB11 source test pins an unmodified GetBots.
          # It belongs to the untouched parent, not the extension's source.
          # Do not silently weaken/rewrite it. Verify the original at exact
          # immutable PB11 and check child via its new exact reconstruction.
          git worktree add --detach /tmp/pb11-original \
            a612093fde694fadf79d0bd790fcd82cb4f9b6b8 >/dev/null
          python3 -B -m unittest discover -s /tmp/pb11-original/tests \
            -p test_f14_vanilla_tbc_rndbot_population_hold_source.py -v
          echo 'PASS: original PB11 source/selector contract untouched'
      - name: Preserve PB10 preflight and birth readback checks
        shell: bash
        run: |
          set -euo pipefail
          for name in \
              test_f14_new_randombot_birth_probe_source.py \
              test_f14_birth_preflight_abort_source.py \
              test_f14_birth_commit_readback_source.py; do
            python3 -B -m unittest discover -s tests -p "$name" -v
          done
      - name: Limit of evidence
        if: always()
        run: |
          echo 'SOURCE/MODEL only: NOT a full Worldserver link, runtime reboot, or game client test.'
          echo 'UNKNOWN character cache/type1 account => unchanged original replay; no global human block.'
          echo 'No SQL/character/event deletion, paid/stage8, hide/WHO/NPC or F14 deployment.'
