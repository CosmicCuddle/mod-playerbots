name: Playerbots F14 upstream 405f restack\n\non:\n  push:\n    branches:\n      - sync/cs01-pb-upstream-405f811-f14-preservation-20261112\n  pull_request:\n    paths:\n      - 'conf/playerbots.conf.dist'\n      - 'src/Bot/**'\n      - 'src/PlayerbotAIConfig.*'\n      - 'tests/f14_*'\n      - 'tests/test_f14_upstream_405f_restack_source.py'\n      - '.github/workflows/playerbots-f14-upstream-405f-restack-20261112.yml'\n\njobs:\n  restack-contract:\n    strategy:\n      fail-fast: false\n      matrix:\n        include:\n          - compiler: g++\n            std: c++17\n          - compiler: g++\n            std: c++20\n          - compiler: clang++\n            std: c++17\n          - compiler: clang++\n            std: c++20\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Verify current upstream/F14 source contract\n        run: python3 tests/test_f14_upstream_405f_restack_source.py\n      - name: Compile and execute pure preservation models\n        shell: bash\n        run: |\n          set -euo pipefail\n          CXX='${{ matrix.compiler }}'\n          STD='${{ matrix.std }}'\n          tests=(\n            tests/f14_vanilla_rndbot_population_quota.cpp\n            tests/f14_vanilla_tbc_rndbot_population_hold.cpp\n            tests/f14_pending_rndbot_login_hold.cpp\n            tests/f14_new_randombot_birth_probe.cpp\n            tests/f14_earned_marker_reset_model.cpp\n            tests/f14_birth_commit_readback_model.cpp\n          )\n          for src in "${tests[@]}"; do\n            out="/tmp/$(basename "$src" .cpp)"\n            "$CXX" -std="$STD" -Wall -Wextra -Werror -pedantic "$src" -o "$out"\n            "$out"\n            "$CXX" -std="$STD" -DNDEBUG -Wall -Wextra -Werror -pedantic "$src" -o "$out.ndebug"\n            "$out.ndebug"\n          done\n