name: F14 PB7 + synthetic committed-DB birth proof (TEST ONLY)

on:
  push:
    branches:
      - test/cs01-pb7-preserve-pb5-commit-proof-tests-20261107
  pull_request:
    branches:
      - integration/cs01-pb1-pb6-preserve-tests-off-20261107

permissions:
  contents: read

jobs:
  synthetic-commit-proof:
    name: Actual PB7 header + original PB5 fake commit tests, reset/retire still OFF
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout actual owner PB draft head only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact owner Core #2 default-FALSE F14 API (READ ONLY)
        uses: actions/checkout@v4
        with:
          repository: CosmicCuddle/azerothcore-wotlk
          ref: d2066943e19cd959de2a0e9897135573e4124219
          path: _pinned_core
          persist-credentials: false

      - name: Verify exact PB7 parent, six test-only paths, no source or SQL changes
        shell: bash
        run: |
          set -euo pipefail
          parent=4f6974ecec081c2006df54ff54aa4cc40cb63f55
          test "$(git -C _pinned_core rev-parse HEAD)" = d2066943e19cd959de2a0e9897135573e4124219
          git merge-base --is-ancestor "$parent" HEAD
          git diff --check "$parent" HEAD
          git diff --name-only "$parent" HEAD | sort > /tmp/actual
          printf '%s\n' \
            'tests/f14_synthetic_db_commit_receipt_model.h' \
            'tests/f14_synthetic_db_commit_receipt_model.cpp' \
            'tests/test_f14_synthetic_db_commit_receipt_source.py' \
            'tests/test_f14_pinned_core_save_receipt_source.py' \
            '.github/workflows/f14-newbot-synthetic-commit-proof-testonly-20261107.yml' \
            'docs/F14-SYNTHETIC-PER-GUID-COMMIT-RECEIPT-PREFLIGHT-20261107.md' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$parent" HEAD -- src conf data sql modules)"
          grep -Fqx 'Playerbots.F14TrackNewRandomBotBirth = 0' conf/playerbots.conf.dist
          grep -Fqx 'Playerbots.ResetQuestsPreserveQuestIds =' conf/playerbots.conf.dist
          test "$(git hash-object src/Bot/F14NewRandomBotBirthProbe.h)" = a75869910778532a235cadc54a16100a0363bd4a
          echo 'PASS exactly six test/docs/CI paths on owner PB7; unchanged birth header and defaults OFF'

      - name: Source guards and integrated PB7 reset/birth/retirement regression
        run: |
          python3 -B -m unittest discover -s tests -p 'test_f14_synthetic_db_commit_receipt_source.py' -v
          python3 -B -m unittest discover -s tests -p 'test_f14_new_randombot_birth_probe_source.py' -v
          python3 -B -m unittest discover -s tests -p 'test_f14_holder_retire_source.py' -v
          python3 -B -m unittest discover -s tests -p 'test_f14_earned_marker_reset_source.py' -v
          F14_OWNER_CORE=_pinned_core python3 -B -m unittest discover -s tests -p 'test_f14_pinned_core_save_receipt_source.py' -v

      - name: Actual PB7 observer + synthetic fake callback/readback native tests
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            for std in c++17 c++20; do
              for mode in normal ndebug; do
                flags=()
                if [[ "$mode" == ndebug ]]; then flags=(-DNDEBUG); fi
                "$compiler" "-std=$std" -pthread -Wall -Wextra -Werror -pedantic -O1 "${flags[@]}" \
                  tests/f14_synthetic_db_commit_receipt_model.cpp -Isrc/Bot -Itests \
                  -o /tmp/f14-commit-model
                /tmp/f14-commit-model
              done
            done
          done
          echo 'PASS real PB7 header + original PB5 synthetic fake-DB proof ordering (eight compiler modes)'

      - name: Eight-thread race safety of test-only synthetic model
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -fsanitize=thread -g -O1 -pthread \
            tests/f14_synthetic_db_commit_receipt_model.cpp -Isrc/Bot -Itests \
            -o /tmp/f14-commit-model-tsan
          TSAN_OPTIONS=halt_on_error=1 /tmp/f14-commit-model-tsan

      - name: Safety / no release authority
        if: always()
        run: |
          echo 'All DB callback and pre/post character SELECT results are FAKE in this test.'
          echo 'Core Player::SaveToDB(true,false) still has no per-GUID commit callback.'
          echo 'No actual commit, SQL migration, IP stage8, paid, client or game test.'
          echo 'F14/paid toggles OFF. PR remains DRAFT; no merge/install/production consent.'
