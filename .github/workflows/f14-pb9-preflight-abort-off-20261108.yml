name: CosmicCuddle F14 PB9 failed preflight abort OFF (source)
on:
  push:
    branches:
      - feature/cs01-f14-pb9-preflight-abort-20261108
  pull_request:
    branches:
      - feature/cs01-f14-pb-commit-readback-audit-off-20261108
permissions:
  contents: read
jobs:
  audited-creation-must-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Checkout exact owner PB branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require parent SHA, exact five paths and no SQL files
        shell: bash
        run: |
          set -euo pipefail
          base=3dad409c4dc95f4faa54ec7d5bc6afb4f1c8c4c5
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD | sort >/tmp/actual
          printf '%s\n' \
            '.github/workflows/f14-pb9-preflight-abort-off-20261108.yml' \
            'src/Bot/Factory/RandomPlayerbotFactory.cpp' \
            'tests/test_f14_birth_preflight_abort_source.py' \
            'docs/F14-PB9-FAILED-PREFLIGHT-ABORT-20261108.md' \
            'docs/CUSTOM_MODIFICATIONS_REGISTER.md' | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git diff --name-only "$base" HEAD -- data/ sql/ conf/)"
          grep -Fqx 'Playerbots.F14TrackNewRandomBotBirth = 0' conf/playerbots.conf.dist
          grep -Fqx 'Playerbots.F14AuditNewBirthCommitReadback = 0' conf/playerbots.conf.dist
      - name: New refusal-before-save and mutation regressions
        run: python3 -B -m unittest discover -s tests -p test_f14_birth_preflight_abort_source.py -v
      - name: Preserve all PB9 source and PB7 original safety suites
        run: |
          python3 -B -m unittest discover -s tests -p test_f14_birth_commit_readback_source.py -v
          python3 -B -m unittest discover -s tests -p test_f14_holder_retire_source.py -v
          python3 -B -m unittest discover -s tests -p test_f14_new_randombot_birth_probe_source.py -v
          python3 -B -m unittest discover -s tests -p test_f14_earned_marker_reset_source.py -v
      - name: Compile and run actual PB birth header native tests
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          for std in c++17 c++20; do
            for mode in normal ndebug; do
              flags=()
              if [[ "$mode" == ndebug ]]; then flags=(-DNDEBUG); fi
              "$CXX" "-std=$std" -pthread -O1 -Wall -Wextra -Werror -pedantic "${flags[@]}" -Isrc/Bot \
                tests/f14_birth_commit_readback_model.cpp -o /tmp/f14-pb9-audit
              /tmp/f14-pb9-audit
              "$CXX" "-std=$std" -pthread -O1 -Wall -Wextra -Werror -pedantic "${flags[@]}" -Isrc/Bot \
                tests/f14_new_randombot_birth_probe.cpp -o /tmp/f14-pb7-original
              /tmp/f14-pb7-original
            done
          done
      - name: State confidence boundary
        if: always()
        run: |
          echo 'This source check is NOT a native factory compilation, full Worldserver link or actual database test.'
          echo 'Both diagnostic flags OFF; existing saved character records, stage8, WHO and NPC visibility untouched.'
          echo 'No owner-host, SQL cleanup, delete, merge, installation or deployment authorized.'
